<!doctype html><html><head><meta charset="utf-8"><title>VOX Audio Verification</title></head><body><h1>VOX audio verification</h1><button id="run">Run audio checks</button><pre id="report">Ready</pre><script type="module">
import {Engine,starterSample,decodePcmWav,drumSample} from './engine.js';import {createState} from './model.js';
const report=document.querySelector('#report'),assert=(v,m)=>{if(!v)throw Error(m);};let lines=[];const log=m=>{lines.push(m);report.textContent=lines.join('\n');};
document.querySelector('#run').onclick=async()=>{try{lines=[];const engine=new Engine;await engine.init();const wav=await fetch('./sounds/voice-01.wav').then(r=>r.arrayBuffer());const sample=decodePcmWav(wav,'Hello, operator');assert(sample.data.length>0,'speech empty');engine.startCapture();engine.play(sample,{pitch:0,formant:0,start:0,speed:1},0,0,'voice',engine.ctx.currentTime+.01);await new Promise(r=>setTimeout(r,650));const capture=await engine.finishCapture();const v=new DataView(capture);let max=0;for(let i=44;i<v.byteLength;i+=2)max=Math.max(max,Math.abs(v.getInt16(i,true)));assert(max>200,'live capture silent');log('PASS real-time playback and stereo performance capture: peak '+max);
const input=new AudioWorkletNode(engine.ctx,'vox-input');const gain=engine.ctx.createGain();gain.gain.value=0;input.connect(gain);gain.connect(engine.ctx.destination);let chunks=[],clocks=0;let done;input.port.onmessage=({data})=>{if(data.kind==='chunk')chunks.push(...data.channels[0]);if(data.kind==='clock')clocks++;if(data.kind==='finished')done?.();};input.port.postMessage({record:true});const src=engine.ctx.createBufferSource(),b=engine.ctx.createBuffer(2,Math.ceil(engine.ctx.sampleRate*.45),engine.ctx.sampleRate);for(let c=0;c<2;c++){const a=b.getChannelData(c);for(let i=0;i<a.length;i++)a[i]=i%(engine.ctx.sampleRate*.1)<100?.6:0;}src.buffer=b;src.connect(input);src.start();await new Promise(r=>setTimeout(r,550));await new Promise(r=>{done=r;input.port.postMessage({record:false});});assert(chunks.length>1000,'input capture empty');assert(clocks>=3,'sync pulses not detected');log('PASS simulated line input capture + clock detection: '+chunks.length+' samples, '+clocks+' pulses');input.disconnect();
const state=createState();state.samples=Array.from({length:15},(_,i)=>starterSample(i));state.samples[0]=sample;const ctx=new OfflineAudioContext(2,22050*5,22050);const offline=new Engine(ctx);offline.connectGraph();offline.setVolume(5);let t=0;for(let fx=9;fx<=16;fx++){const step={voice:{slot:0,note:0,params:null,voice:(fx-9)%8},drum:{hit:fx-9},multiplier:2};offline.trigger(state,step,fx,t,.5,fx);t+=.5;}const rendered=await ctx.startRendering();const pcm=rendered.getChannelData(0);assert(pcm.every(Number.isFinite),'nonfinite offline output');assert(pcm.some(x=>Math.abs(x)>.01),'offline output silent');log('PASS offline rendering of 8 voices, performance effects and drum hits');await engine.ctx.close();log('ALL AUDIO CHECKS PASSED');}catch(e){log('FAIL '+e.message);console.error(e);}};
</script></body></html>
